<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Traffic Map</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    120deg,
                    #1b2745,
                    #0b1120
                );

            color: #e5e7eb;

        }


        nav {

            height: 82px;

            display: flex;

            align-items: center;

            padding: 0 42px;

            background: #0a1020;

            border-bottom:
                1px solid #26324b;

        }


        .logo {

            font-size: 28px;

            font-weight: bold;

            margin-right: auto;

        }


        .logo span {

            color: #3b82f6;

        }


        .nav-links {

            display: flex;

            gap: 45px;

        }


        .nav-links a {

            color: #9ca3af;

            text-decoration: none;

            font-size: 18px;

        }


        .nav-links a:hover {

            color: #3b82f6;

        }


        .container {

            max-width: 1400px;

            margin: auto;

            padding: 45px 35px;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #9ca3af;

            margin-bottom: 30px;

        }


        .panel {

            background: #141c32;

            border:
                1px solid #28334d;

            border-radius: 14px;

            padding: 30px;

        }


        button {

            padding: 14px 28px;

            background: #3b82f6;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #status {

            margin-top: 20px;

            color: #60a5fa;

        }


        .map-box {

            margin-top: 30px;

            width: 100%;

            height: 700px;

            border:
                1px solid #28334d;

            border-radius: 12px;

            overflow: hidden;

            display: none;

        }


        iframe {

            width: 100%;

            height: 100%;

            border: none;

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">

        Traffic<span>AI</span>

    </div>


    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/predict">
            Predictions
        </a>

        <a href="/map">
            Map
        </a>

    </div>

</nav>



<div class="container">


    <h1>
        Full Traffic Route Map
    </h1>


    <p class="subtitle">

        Visualize the predicted traffic conditions
        generated by the Hybrid GAT-LSTM model.

    </p>


    <div class="panel">


        <button
            onclick="generateMap()"
        >
            Generate Full Traffic Map
        </button>


        <div id="status"></div>


        <div
            id="mapBox"
            class="map-box"
        >

            <iframe
                id="trafficMap"
                title="Traffic map"
            ></iframe>

        </div>


    </div>


</div>



<script>


    async function generateMap() {


        const status =
            document.getElementById(
                "status"
            );


        const mapBox =
            document.getElementById(
                "mapBox"
            );


        const map =
            document.getElementById(
                "trafficMap"
            );


        status.innerText =
            "Generating map from the latest prediction...";


        try {


            const response =
                await fetch(
                    "/api/route_map_full",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({})

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Map generation failed."
                );

            }


            map.src =
                data.map_url
                + "?t="
                + Date.now();


            mapBox.style.display =
                "block";


            status.innerText =
                "Traffic map generated successfully.";


        }

        catch(error) {

            status.innerText =
                "Error: "
                + error.message;

        }

    }

</script>


</body>

</html>
